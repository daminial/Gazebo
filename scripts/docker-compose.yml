services:
  postgres:
    image: postgres:17-alpine
    container_name: gazebo_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gazebo_network

  minio:
    image: minio/minio:latest
    container_name: gazebo_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_REGION_NAME: us-east-1
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - gazebo_network

  livekit:
    image: livekit/livekit-server:latest
    container_name: gazebo_livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit-config.yaml:/app/config.yaml:ro
    command: --config /app/config.yaml --node-ip 192.168.1.166
    networks:
      - gazebo_network

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: gazebo_backend:latest
    container_name: gazebo_backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: https://192.168.1.166/minio
      LIVEKIT_URL: wss://192.168.1.166
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
      - livekit
    restart: unless-stopped
    networks:
      - gazebo_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://192.168.1.166/api
    image: gazebo_frontend:latest
    container_name: gazebo_frontend
    environment:
      - VITE_API_URL=http://192.168.1.166/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gazebo_network

  nginx:
    image: nginx:alpine
    container_name: gazebo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-conf/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - gazebo_network

networks:
  gazebo_network:
    driver: bridge

volumes:
  postgres_data: